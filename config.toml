baseURL = "https://deniskyashif.com"
locale = "en-us"
title = "Denis Kyashif's Blog"
theme = "tale"
disqusShortname = "deniskyashif"
googleAnalytics = "G-X7Z9LV9QY4"


[Params]
author = { name = "Denis Kyashif", homepage = "https://deniskyashif.com" }
css = [
  "https://fonts.googleapis.com/css?family=Libre+Baskerville:400,400i,700",
  "https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap",
  "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css",
  "assets/my.css"
]
description = "My blog on computer science and software development."
images = ["/images/site-feature-image.png"]
socialShareTwitter = false
socialShareFacebook = false
socialShareReddit = true
socialShareLinkedin = true
socialSharePinterest = false
socialShareEmail = true
socialShareBluesky = true
socialShareHackerNews = true
socialShareLobsters = true
enableComments = false

[taxonomies]
  tags = "tags"

[permalinks]
  posts = "/:year/:month/:day/:title/"

[markup.goldmark.renderer]
unsafe = true

[markup]
  [markup.highlight]
    codeFences = true
    noClasses = false
    hl_Lines = ""
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    style = "manni"
    tabWidth = 4
