<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="20 20 860 520" role="img" aria-labelledby="title desc">
  <title id="title">Translation at the edge of a bounded context</title>
  <desc id="desc">Concentric architecture layers show an aggregate raising a domain event in the domain layer. The application layer translates it into an integration event, which crosses the bounded-context boundary to a message broker.</desc>

  <rect x="20" y="20" width="860" height="520" fill="#fff"/>
  <rect x="30" y="30" width="650" height="500" rx="12" fill="none" stroke="#3a414a" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="54" y="64" fill="#3a414a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Ordering bounded context</text>

  <circle cx="330" cy="300" r="205" fill="#eef1f4" stroke="#3a414a" stroke-width="2"/>
  <circle cx="330" cy="300" r="145" fill="#fff" stroke="#3a414a" stroke-width="2"/>
  <circle cx="330" cy="300" r="82" fill="#3a414a"/>

  <text x="330" y="122" text-anchor="middle" fill="#3a414a" font-family="Arial, sans-serif" font-size="16" font-weight="700">Infrastructure</text>
  <text x="330" y="181" text-anchor="middle" fill="#3a414a" font-family="Arial, sans-serif" font-size="16" font-weight="700">Application</text>
  <text x="330" y="286" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Domain</text>
  <text x="330" y="310" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14">Aggregate</text>

  <path d="M390 330 C430 350 446 327 465 296" fill="none" stroke="#3a414a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="440" y="373" text-anchor="middle" fill="#3a414a" font-family="Arial, sans-serif" font-size="14">Domain event</text>
  <text x="440" y="391" text-anchor="middle" fill="#3a414a" font-family="Arial, sans-serif" font-size="13">(internal)</text>

  <rect x="443" y="225" width="155" height="68" rx="7" fill="#fff" stroke="#3a414a" stroke-width="2"/>
  <text x="520.5" y="252" text-anchor="middle" fill="#3a414a" font-family="Arial, sans-serif" font-size="14" font-weight="700">Event mapper</text>
  <text x="520.5" y="274" text-anchor="middle" fill="#3a414a" font-family="Arial, sans-serif" font-size="13">translates at the edge</text>

  <path d="M598 259 H730" fill="none" stroke="#3a414a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="664" y="239" text-anchor="middle" fill="#3a414a" font-family="Arial, sans-serif" font-size="14">Integration event</text>
  <text x="664" y="284" text-anchor="middle" fill="#3a414a" font-family="Arial, sans-serif" font-size="13">public contract</text>

  <rect x="732" y="218" width="138" height="82" rx="8" fill="#3a414a"/>
  <text x="801" y="252" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Message</text>
  <text x="801" y="274" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="700">broker</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#3a414a"/>
    </marker>
  </defs>
</svg>
